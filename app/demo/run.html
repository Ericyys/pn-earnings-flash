<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PN 試跑</title>
<link id="gf" rel="stylesheet" href="">
<style>
  body { margin: 0; background: #EEF2F6; font-family: Inter, "Noto Sans TC", sans-serif; color: #0A1628; }
  main { padding: 16px; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 400; }
  h2 { font-size: 16px; font-weight: 400; margin-top: 32px; border-bottom: 1px solid #0A1628; padding-bottom: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; background: #FFFFFF; }
  td, th { padding: 8px 12px; border-bottom: 1px solid #D5DCE4; text-align: left; vertical-align: top; }
  th { background: #F7F9FB; font-weight: 400; color: #3E4C5E; }
  .pass { color: #0A6E99; } .fail { color: #C2410C; } .warn { color: #B2860A; } .skip { color: #5F6B7D; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 24px; }
  figure { margin: 0; } figure svg { width: 100%; height: auto; display: block; }
  figcaption { font-size: 13px; padding: 8px 0; color: #3E4C5E; }
  body.capture main > :not(#grid) { display: none; }
  body.capture main { padding: 0; max-width: none; }
  body.capture #grid { display: block; }
  body.capture figure svg { width: 1080px; height: 1350px; }
  body.capture figcaption { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="ttl">PN 財報快報｜試跑</h1>
  <h2>自動檢查</h2>
  <table id="checks"><thead><tr><th>結果</th><th>項目</th><th>說明</th></tr></thead><tbody></tbody></table>
  <h2>選圖</h2>
  <div id="sel"></div>
  <h2>圖卡</h2>
  <div id="grid"></div>
</main>
<script type="module">
  import { analyze, parseFactSheet } from "../lib/compute.js";
  import { renderCard } from "../templates/index.js";
  import { createMeasurer } from "../lib/text.js";
  import { ensureFonts, installLocalAliases } from "../lib/fonts.js";

  const q = new URLSearchParams(location.search);
  const get = async (p) => (await fetch(p)).text();
  const brand = JSON.parse(await get("../brand.json"));
  if (q.get("local") === "1") installLocalAliases(); else document.getElementById("gf").href = brand.fonts.web_source;
  if (q.get("capture") === "1") document.body.classList.add("capture");

  const fs = parseFactSheet(await get(q.get("fs")));
  const market = fs.meta.market;
  const ctx = {
    profile: JSON.parse(await get(`../../profiles/${market}.json`)),
    company: q.get("company") ? JSON.parse(await get(q.get("company"))) : {},
    triggers: JSON.parse(await get("../../rules/triggers.json")),
    labels: JSON.parse(await get("../../references/labels_zh.json")).labels,
    history: [],
  };
  const out = analyze(fs, ctx);
  document.getElementById("ttl").textContent = `PN 財報快報｜試跑：${fs.meta.ticker} ${fs.meta.fiscal_period}（${fs.extraction.ai_name}）`;
  const label = { pass: "通過", fail: "不通過", warn: "需確認", skip: "略過" };
  document.querySelector("#checks tbody").innerHTML = out.checks
    .map((c) => `<tr><td class="${c.status}">${label[c.status]}</td><td>${c.label}</td><td>${c.detail || ""}</td></tr>`).join("");
  const s = out.selection;
  document.getElementById("sel").innerHTML = `<p>這次的張次：${s.deck.join(" → ")}</p>
    <p>觸發：${Object.entries(s.fired).map(([k, v]) => `${k}（${v.join("、")}）`).join("；") || "無"}</p>
    <p>因資料不足略過：${Object.entries(s.skipped).map(([k, v]) => `${k}（缺 ${v.join("、")}）`).join("；") || "無"}</p>
    <p>PN 計算的數字：${out.derived.join("；") || "無"}</p>`;

  const theme = q.get("theme") || "light";
  await ensureFonts(brand, out.cards);
  const measure = createMeasurer();
  const grid = document.getElementById("grid");
  for (const spec of out.cards) {
    const r = renderCard({ ...spec, theme }, brand, measure);
    const fig = document.createElement("figure");
    fig.dataset.id = spec.id;
    fig.innerHTML = r.svg + `<figcaption>${spec.id}｜${r.template}${r.fallback ? "｜" + r.fallback : ""}</figcaption>`;
    grid.appendChild(fig);
  }
  window.__rendered = true;
</script>
</body>
</html>
