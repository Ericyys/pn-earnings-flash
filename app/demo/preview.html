<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PN 底稿預覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" rel="stylesheet" href="">
<style>
  body { margin: 0; background: #EEF2F6; font-family: Inter, "Noto Sans TC", sans-serif; color: #0A1628; }
  header { padding: 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; font-weight: 400; margin: 0; }
  button { font: inherit; padding: 8px 16px; border: 1px solid #0A1628; background: #FFFFFF; border-radius: 0; cursor: pointer; }
  button[aria-pressed="true"] { background: #0A1628; color: #FFFFFF; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 24px; padding: 16px; }
  figure { margin: 0; }
  figure svg { width: 100%; height: auto; display: block; }
  figcaption { font-size: 14px; padding: 8px 0; color: #3E4C5E; }
  .card-full { width: 1080px; height: 1350px; }
  body.capture #grid { display: block; padding: 0; }
  body.capture header, body.capture figcaption { display: none; }
  body.capture figure svg { width: 1080px; height: 1350px; }
</style>
</head>
<body>
<header>
  <h1>PN 財報快報｜底稿預覽（示範數據）</h1>
</header>
<div id="grid"></div>
<script type="module">
  import { renderCard } from "../templates/index.js";
  import { createMeasurer } from "../lib/text.js";
  import { ensureFonts, installLocalAliases } from "../lib/fonts.js";
  import { DEMO_CARDS } from "./demo_cards.js";

  const params = new URLSearchParams(location.search);
  const brand = await (await fetch("../brand.json")).json();
  if (params.get("local") === "1") installLocalAliases();
  else document.getElementById("gf").href = brand.fonts.web_source;
  if (params.get("capture") === "1") document.body.classList.add("capture");

  await ensureFonts(brand, DEMO_CARDS);
  const measure = createMeasurer();
  const grid = document.getElementById("grid");

  function draw() {
    grid.innerHTML = "";
    for (const spec of DEMO_CARDS) {
      const out = renderCard(spec, brand, measure);
      const fig = document.createElement("figure");
      fig.dataset.id = spec.id;
      fig.innerHTML = out.svg + `<figcaption>${spec.id}｜${out.template}${out.fallback ? "｜" + out.fallback : ""}</figcaption>`;
      grid.appendChild(fig);
    }
    window.__rendered = true;
  }
  draw();
</script>
</body>
</html>
